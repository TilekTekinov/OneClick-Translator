<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OneClick Translator - Options</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; max-width: 900px; }
      h1 { font-size: 20px; }
      .domain-block { border: 1px solid #ddd; padding: 12px; margin-bottom: 12px; border-radius: 6px; }
      .selectors { margin-top: 8px; }
      .selector-item { display:flex; gap:8px; align-items:center; margin-bottom:6px;}
      select { width:120px; }
      button { margin-right:8px; }
      .empty { color: #666 }
    </style>
  </head>
  <body>
    <h1>OneClick Translator — Settings</h1>

    <h2>Global translation language</h2>
    <select id="globalLang">
      <option value="ru">Russian</option>
      <option value="en">English</option>
      <option value="cs">Czech</option>
      <option value="de">German</option>
      <option value="fr">French</option>
      <option value="es">Spanish</option>
      <option value="uk">Ukrainian</option>
      <option value="auto">Auto-detect</option>
    </select>
    <button id="saveGlobalLang">Save Language</button>

    <hr />
    <h2>Saved selectors per site</h2>
    <div id="domainsContainer"></div>

    <script src="../js/options.js"></script>
  </body>
</html>
